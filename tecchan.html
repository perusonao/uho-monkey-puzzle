<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>てっちゃんといっしょ</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3dfb4;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#49301e}body{display:flex;justify-content:center}.app{width:min(100%,430px);min-height:100svh;padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));background:linear-gradient(#fff1c9,#d9efbd)}header{display:flex;align-items:center;justify-content:space-between}.title{font-weight:900;font-size:22px}.day{background:#fff8dc;border:2px solid #9c6b35;border-radius:16px;padding:6px 10px;font-weight:800}.bubble{margin:12px 4px 8px;background:white;border:3px solid #80532c;border-radius:22px;padding:12px 16px;font-weight:800;min-height:54px;box-shadow:0 4px 0 #c79b62}.hero{position:relative;height:min(43svh,390px);border-radius:28px;overflow:hidden;background:linear-gradient(#d9f1ff 0 56%,#b9db83 56%);border:3px solid #80532c}.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 35%;transition:.18s}.hero.react img{transform:scale(1.035)}.heart{position:absolute;left:50%;top:22%;font-size:42px;opacity:0;transform:translate(-50%,10px)}.hero.react .heart{animation:pop .7s}@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}35%{opacity:1;transform:translate(-50%,-18px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-45px)}}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.stat{background:#fff9e8;border:2px solid #aa7a45;border-radius:15px;padding:8px 10px;font-size:12px;font-weight:800}.bar{height:9px;background:#e3d5b7;border-radius:8px;overflow:hidden;margin-top:5px}.fill{height:100%;background:#ef9f38;transition:.3s}.mood .fill{background:#ef7183}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button{border:0;border-bottom:5px solid #7e552d;border-radius:18px;padding:11px 3px 8px;background:#ffcf54;color:#4b2b15;font-weight:900;font-size:15px;min-height:62px}.actions button:active{transform:translateY(3px);border-bottom-width:2px}.actions span{display:block;font-size:24px}.footer{text-align:center;font-size:11px;font-weight:700;opacity:.72;margin-top:9px}</style></head><body><main class="app"><header><div class="title">てっちゃんといっしょ</div><div class="day" id="day">Day 1</div></header><div class="bubble" id="bubble">ウホッ！きょうは何して遊ぶ？</div><section class="hero" id="hero"><img src="assets/monkey-face.webp" alt="てっちゃん"><div class="heart" id="heart">♥</div></section><section class="stats"><div class="stat">🍌 おなか<div class="bar"><div class="fill" id="hunger"></div></div></div><div class="stat mood">😊 ごきげん<div class="bar"><div class="fill" id="mood"></div></div></div></section><section class="actions"><button data-act="food"><span>🍌</span>ごはん</button><button data-act="pet"><span>🤲</span>なでる</button><button data-act="play"><span>🎮</span>遊ぶ</button></section><div class="footer" id="footer"></div></main><script>
const KEY='tecchanGrowthV1';const defaults={schemaVersion:1,day:1,hunger:65,mood:70,friendship:0,actions:0};let s;try{s={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s={...defaults}};
const $=id=>document.getElementById(id),bubble=$('bubble'),hero=$('hero');function save(){localStorage.setItem(KEY,JSON.stringify(s))}function clamp(n){return Math.max(0,Math.min(100,n))}function render(){s.hunger=clamp(s.hunger);s.mood=clamp(s.mood);$('hunger').style.width=s.hunger+'%';$('mood').style.width=s.mood+'%';$('day').textContent='Day '+s.day;$('footer').textContent='なかよし '+s.friendship+'　・　きょうのお世話 '+s.actions+'回'}function react(text,heart=true){bubble.textContent=text;hero.classList.remove('react');void hero.offsetWidth;if(heart)hero.classList.add('react')}
const lines={food:['ウホッ！おいしい！もっと食べたい！','もぐもぐ……しあわせウホ。','バナナだ！やったー！'],pet:['えへへ。そこ、気持ちいいウホ。','もっとなでてほしいウホ！','てっちゃん、うれしい！'],play:['遊ぶウホ！負けないぞ！','ウホウホ！たのしい！','もう一回やろう！']};function action(type){s.actions++;if(type==='food'){s.hunger+=22;s.mood+=3;s.friendship+=1}else if(type==='pet'){s.mood+=14;s.friendship+=3}else{s.mood+=10;s.hunger-=5;s.friendship+=2}const a=lines[type];react(a[Math.floor(Math.random()*a.length)]);save();render()}document.querySelectorAll('button').forEach(b=>b.onclick=()=>action(b.dataset.act));render();
</script></body></html>
