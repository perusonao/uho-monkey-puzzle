<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>てっちゃんといっしょ</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#3d302c;background:#ead4b8}button{font:inherit}.app{position:relative;width:min(100vw,430px);height:100svh;margin:auto;overflow:hidden;background:#e9d1ae}.room{position:absolute;inset:0;background:linear-gradient(#c9e9ff 0 20%,#f6e5c9 20% 66%,#b97e45 66%);overflow:hidden}.window{position:absolute;top:11%;left:29%;width:43%;height:28%;border:8px solid #a86d3c;background:linear-gradient(#83d5ff 0 67%,#8fc477 67%);box-shadow:inset 0 0 0 3px #fff8}.window:after{content:'';position:absolute;left:48%;top:0;width:6px;height:100%;background:#a86d3c}.sofa{position:absolute;left:-5%;top:44%;width:45%;height:23%;background:#5689aa;border-radius:25px 25px 9px 9px;box-shadow:inset 0 -18px #3d6988}.table{position:absolute;left:23%;top:61%;width:37%;height:7%;background:#b97a3d;border-radius:50%;box-shadow:0 28px 0 -14px #8b542d}.bed{position:absolute;right:-8%;top:45%;width:42%;height:23%;background:#f4ca50;border:9px solid #9b6235;border-radius:14px 0 0 8px}.shelf{position:absolute;right:2%;top:20%;width:19%;height:25%;background:#9b6235;border-radius:5px;box-shadow:inset 0 5px #714522}.tv{position:absolute;left:1%;top:30%;width:25%;height:17%;background:#252b32;border:7px solid #76502f;border-radius:8px}.rug{position:absolute;left:13%;bottom:13%;width:75%;height:25%;border-radius:50%;background:#eee0c4;opacity:.9}.plant{position:absolute;left:2%;top:46%;font-size:55px}.toy{position:absolute;right:19%;bottom:17%;font-size:35px}.character{position:absolute;z-index:4;width:34%;left:50%;bottom:14%;transform:translateX(-50%);transition:left .65s ease,bottom .65s ease,transform .25s}.character img{display:block;width:100%;filter:drop-shadow(0 8px 7px #0004)}.character.react{transform:translateX(-50%) scale(1.05)}.character.tableSpot{left:47%;bottom:29%}.character.sofaSpot{left:25%;bottom:30%}.character.bedSpot{left:79%;bottom:30%}.character.playSpot{left:68%;bottom:16%}.bubble{position:absolute;z-index:8;top:18%;left:39%;max-width:55%;background:#fff;border:3px solid #6d5a50;border-radius:22px;padding:11px 13px;font-weight:800;font-size:14px;box-shadow:0 3px 8px #0002}.profile{position:absolute;z-index:10;top:max(8px,env(safe-area-inset-top));left:9px;background:#fffffff0;border:2px solid #6d5a50;border-radius:18px;padding:7px 11px;font-weight:900;font-size:14px}.profile small{display:block;font-weight:700}.clock{position:absolute;z-index:10;top:max(8px,env(safe-area-inset-top));right:9px;background:#fffffff0;border:2px solid #6d5a50;border-radius:18px;padding:7px 10px;text-align:center;font-weight:900;font-size:12px}.stats{position:absolute;z-index:9;left:9px;top:31%;width:29%;background:#fffffff0;border:2px solid #6d5a50;border-radius:17px;padding:8px}.stat{font-size:11px;font-weight:900;margin:5px 0}.bar{height:7px;background:#ddd;border-radius:6px;overflow:hidden;margin-top:2px}.fill{height:100%;background:#64c972;transition:.3s}.pink{background:#ee7992}.blue{background:#65aee8}.side{position:absolute;z-index:9;right:8px;top:28%;display:grid;gap:7px}.side button{width:54px;height:54px;border:2px solid #786254;border-radius:18px;background:#fffffff0;font-size:10px;font-weight:900}.side b{display:block;font-size:20px}.actions{position:absolute;z-index:12;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.actions button{min-height:67px;border:3px solid white;border-bottom:6px solid #856641;border-radius:21px;color:#403027;font-weight:900;font-size:13px;box-shadow:0 2px 5px #0003}.actions span{display:block;font-size:25px}.food{background:#ffd052}.pet{background:#f38b99}.play{background:#67c879}.sleep{background:#69b6ef}.hint{position:absolute;z-index:9;left:9px;bottom:88px;background:#fffffff0;border:2px solid #806858;border-radius:15px;padding:7px 10px;font-size:10px;font-weight:800;max-width:43%}@media(max-height:700px){.bubble{top:15%;font-size:12px}.stats{top:28%}.character{width:29%}.side{top:25%}.hint{display:none}}</style></head><body><main class="app"><section class="room"><div class="window"></div><div class="tv"></div><div class="sofa"></div><div class="table"></div><div class="bed"></div><div class="shelf"></div><div class="rug"></div><div class="plant">🪴</div><div class="toy">⚽</div><div class="character" id="character"><img src="assets/monkey-face.webp" alt="テナガサルオ（てっちゃん）"></div></section><div class="profile">テナガサルオ<small>てっちゃん　Lv.1</small></div><div class="clock" id="clock">--:--<br><small>Day 1</small></div><div class="bubble" id="bubble">おはよう！今日は何をして遊ぼうか？</div><section class="stats"><div class="stat">🍌 おなか<div class="bar"><div class="fill" id="hunger"></div></div></div><div class="stat">♥ なかよし<div class="bar"><div class="fill pink" id="friendship"></div></div></div><div class="stat">😊 ごきげん<div class="bar"><div class="fill pink" id="mood"></div></div></div><div class="stat">⚡ げんき<div class="bar"><div class="fill blue" id="energy"></div></div></div></section><nav class="side"><button><b>🎁</b>プレゼント</button><button><b>🗺️</b>おでかけ</button><button><b>👕</b>着替え</button><button><b>📖</b>日記</button></nav><div class="hint" id="hint">てっちゃんが部屋でのんびりしています</div><section class="actions"><button class="food" data-act="food"><span>🍌</span>ごはん</button><button class="pet" data-act="pet"><span>🤲</span>なでる</button><button class="play" data-act="play"><span>🎮</span>遊ぶ</button><button class="sleep" data-act="sleep"><span>🛏️</span>ねる</button></section></main><script>const KEY='tecchanGrowthV2',defaults={schemaVersion:2,day:1,hunger:70,mood:70,energy:80,friendship:10,activity:'idle',spot:'center'};let s;try{s={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s={...defaults}}const $=id=>document.getElementById(id),c=$('character'),bubble=$('bubble'),hint=$('hint');const clamp=n=>Math.max(0,Math.min(100,n));function save(){localStorage.setItem(KEY,JSON.stringify(s))}function render(){['hunger','mood','energy','friendship'].forEach(k=>{$(k).style.width=clamp(s[k])+'%'});c.className='character '+({food:'tableSpot',pet:'sofaSpot',play:'playSpot',sleep:'bedSpot'}[s.activity]||'');const d=new Date();$('clock').innerHTML=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'<br><small>Day '+s.day+'</small>'}function say(t,h){bubble.textContent=t;hint.textContent=h;c.classList.add('react');setTimeout(()=>c.classList.remove('react'),500)}const reactions={food:['お腹すいてたんだ。いただきます！','テーブルでごはんを食べています'],pet:['ありがとう。なんだか落ち着くなあ。','ソファの近くでうれしそうにしています'],play:['一緒に遊ぼう！何して遊ぶ？','おもちゃのところへ移動しました'],sleep:['ちょっと眠くなってきた……。','ベッドでひと休みします']};function action(type){s.activity=type;if(type==='food'){s.hunger+=22;s.mood+=3;s.friendship+=1}else if(type==='pet'){s.mood+=12;s.friendship+=5}else if(type==='play'){s.mood+=13;s.energy-=8;s.hunger-=4;s.friendship+=3}else{s.energy+=25;s.mood+=3}s.hunger=clamp(s.hunger);s.mood=clamp(s.mood);s.energy=clamp(s.energy);s.friendship=clamp(s.friendship);say(...reactions[type]);save();render()}document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act));render();setInterval(render,30000);</script></body></html>
