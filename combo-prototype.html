<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ウホッ！モンキーコンボ Prototype</title>
<style>html,body{margin:0;width:100%;height:100%;background:#173522;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{touch-action:none}canvas{display:block;margin:auto;touch-action:none}</style>
</head>
<body><canvas id="combo"></canvas><script src="combo-board.js"></script><script>
const cv=document.getElementById('combo'),cx=cv.getContext('2d'),img=new Image();img.src='assets/monkey-face.webp';
let board=MonkeyCombo.createBoard(),drag=null,score=0,combo=0,resolving=false;
function resize(){const d=Math.min(devicePixelRatio||1,2),w=Math.min(innerWidth,430),h=innerHeight;cv.width=w*d;cv.height=h*d;cv.style.width=w+'px';cv.style.height=h+'px';cx.setTransform(d,0,0,d,0,0);cv.w=w;cv.h=h}addEventListener('resize',resize);resize();
function geo(){const gap=5,side=10;const portrait=cv.h>=cv.w;const header=portrait?170:92;const footer=portrait?18:8;const byWidth=Math.floor((cv.w-side*2-gap*5)/6);const byHeight=Math.floor((cv.h-header-footer-gap*4)/5);const cell=Math.max(20,Math.min(byWidth,byHeight));const boardW=cell*6+gap*5,boardH=cell*5+gap*4;const left=Math.floor((cv.w-boardW)/2);const top=Math.max(portrait?150:78,Math.floor(header+(cv.h-header-footer-boardH)/2));return{gap,side:left,cell,top,portrait,boardW,boardH}}
function at(e){const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,g=geo(),c=Math.floor((x-g.side)/(g.cell+g.gap)),r=Math.floor((y-g.top)/(g.cell+g.gap));if(r<0||r>=5||c<0||c>=6)return null;const lx=g.side+c*(g.cell+g.gap),ly=g.top+r*(g.cell+g.gap);return x<=lx+g.cell&&y<=ly+g.cell?{r,c}:null}
cv.onpointerdown=e=>{if(resolving)return;drag=at(e);if(drag)cv.setPointerCapture?.(e.pointerId)};
cv.onpointermove=e=>{if(!drag||resolving)return;const n=at(e);if(n&&MonkeyCombo.swap(board,drag,n))drag=n};
cv.onpointerup=()=>{if(drag&&!resolving){drag=null;resolve()}};cv.onpointercancel=()=>{drag=null};
const wait=n=>new Promise(r=>setTimeout(r,n));async function resolve(){resolving=true;combo=0;while(true){const m=MonkeyCombo.findMatches(board);if(!m.size)break;combo++;score+=m.size*100*combo;MonkeyCombo.clearMatches(board,m);await wait(160);MonkeyCombo.collapse(board);await wait(180)}resolving=false}
function orb(x,y,s,t,a=1){const ring=['#78d45c','#59a8ff','#f3d14b','#e66a67','#b77be8'][t];cx.save();cx.globalAlpha=a;cx.fillStyle=ring;cx.beginPath();cx.arc(x+s/2,y+s/2,s*.47,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(x+s/2,y+s/2,s*.38,0,Math.PI*2);cx.clip();if(img.complete&&img.naturalWidth)cx.drawImage(img,x+s*.12,y+s*.12,s*.76,s*.76);cx.restore()}
function draw(){const w=cv.w,h=cv.h,g=geo(),grad=cx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#193e29');grad.addColorStop(1,'#5f7b3d');cx.fillStyle=grad;cx.fillRect(0,0,w,h);cx.fillStyle='#ffd94f';cx.font=`900 ${g.portrait?25:18}px -apple-system`;cx.fillText('ウホッ！モンキーコンボ',16,g.portrait?42:25);cx.fillStyle='#fff';cx.font=`800 ${g.portrait?18:14}px -apple-system`;cx.fillText('SCORE '+score.toLocaleString(),16,g.portrait?72:48);cx.font=`700 ${g.portrait?14:11}px -apple-system`;cx.fillText('顔をドラッグ → 3つ以上そろえて指を離す',16,g.portrait?118:68);for(let r=0;r<5;r++)for(let c=0;c<6;c++){const x=g.side+c*(g.cell+g.gap),y=g.top+r*(g.cell+g.gap);cx.fillStyle='rgba(0,0,0,.22)';cx.fillRect(x,y,g.cell,g.cell);if(board[r][c]!=null)orb(x+2,y+2,g.cell-4,board[r][c],drag&&drag.r===r&&drag.c===c?.65:1)}if(combo){cx.textAlign='center';cx.fillStyle='#ffe43d';cx.strokeStyle='#54240d';cx.lineWidth=5;cx.font=`900 ${g.portrait?30:22}px -apple-system`;const comboY=Math.max(g.top-10,g.portrait?145:75);cx.strokeText(combo+' COMBO!',w/2,comboY);cx.fillText(combo+' COMBO!',w/2,comboY);cx.textAlign='left'}requestAnimationFrame(draw)}draw();
</script></body></html>
