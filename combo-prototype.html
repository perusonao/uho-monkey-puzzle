<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ウホッ！モンキーコンボ</title><style>html,body{margin:0;width:100%;height:100%;background:#173522;overflow:hidden;font-family:-apple-system,sans-serif}body,canvas{touch-action:none}canvas{display:block;margin:auto}</style></head><body><canvas id="combo"></canvas><script src="combo-board.js"></script><script>
const cv=document.getElementById('combo'),cx=cv.getContext('2d'),img=new Image();img.src='assets/monkey-face.webp';
const GAME=60,MOVE=5,FEVER_TIME=8;let board,drag,score,best=+(localStorage.uhoComboBest||0),combo,resolving,state='title',timeLeft=GAME,moveLeft=MOVE,fever=0,feverLeft=0,last=performance.now(),message='';
function reset(){board=MonkeyCombo.createBoard();drag=null;score=combo=fever=feverLeft=0;timeLeft=GAME;moveLeft=MOVE;resolving=false;message='';state='play'}
function resize(){const d=Math.min(devicePixelRatio||1,2),w=Math.min(innerWidth,430),h=innerHeight;cv.width=w*d;cv.height=h*d;cv.style.width=w+'px';cv.style.height=h+'px';cx.setTransform(d,0,0,d,0,0);cv.w=w;cv.h=h}addEventListener('resize',resize);resize();
function geo(){const gap=5,side=10,p=cv.h>=cv.w,header=p?190:105,footer=p?18:6,bw=Math.floor((cv.w-side*2-gap*5)/6),bh=Math.floor((cv.h-header-footer-gap*4)/5),cell=Math.max(18,Math.min(bw,bh)),boardW=cell*6+gap*5,boardH=cell*5+gap*4,left=(cv.w-boardW)/2,top=Math.max(p?180:98,header+(cv.h-header-footer-boardH)/2);return{gap,side:left,cell,top,p,boardH}}
function at(e){const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,g=geo(),c=Math.floor((x-g.side)/(g.cell+g.gap)),r=Math.floor((y-g.top)/(g.cell+g.gap));if(r<0||r>=5||c<0||c>=6)return null;const lx=g.side+c*(g.cell+g.gap),ly=g.top+r*(g.cell+g.gap);return x<=lx+g.cell&&y<=ly+g.cell?{r,c}:null}
function endDrag(){if(drag&&!resolving){drag=null;moveLeft=MOVE;resolve()}}
cv.onpointerdown=e=>{if(state==='title'||state==='result'){reset();return}if(state!=='play'||resolving)return;drag=at(e);if(drag){moveLeft=MOVE;cv.setPointerCapture?.(e.pointerId)}};cv.onpointermove=e=>{if(!drag||resolving||state!=='play')return;const n=at(e);if(n&&MonkeyCombo.swap(board,drag,n))drag=n};cv.onpointerup=endDrag;cv.onpointercancel=endDrag;
const wait=n=>new Promise(r=>setTimeout(r,n));async function resolve(){resolving=true;combo=0;while(state==='play'){const m=MonkeyCombo.findMatches(board);if(!m.size)break;combo++;const mult=feverLeft>0?2:1;score+=m.size*100*combo*mult;fever=Math.min(100,fever+m.size*2+combo*3);message=combo>=7?'SUPER UHO!!':combo>=4?'ウホウホ！':'';MonkeyCombo.clearMatches(board,m);await wait(140);MonkeyCombo.collapse(board);await wait(170)}if(fever>=100&&feverLeft<=0){fever=0;feverLeft=FEVER_TIME;message='ウホウホフィーバー！'}if(score>best){best=score;localStorage.uhoComboBest=best}resolving=false}
function tick(dt){if(state!=='play')return;if(!resolving){timeLeft-=dt;if(drag){moveLeft-=dt;if(moveLeft<=0)endDrag()}}if(feverLeft>0)feverLeft=Math.max(0,feverLeft-dt);if(timeLeft<=0&&!resolving){timeLeft=0;drag=null;state='result';if(score>best){best=score;localStorage.uhoComboBest=best}}}
function orb(x,y,s,t,a=1){const ring=['#78d45c','#59a8ff','#f3d14b','#e66a67','#b77be8'][t];cx.save();cx.globalAlpha=a;cx.fillStyle=ring;cx.beginPath();cx.arc(x+s/2,y+s/2,s*.47,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(x+s/2,y+s/2,s*.38,0,Math.PI*2);cx.clip();if(img.complete&&img.naturalWidth)cx.drawImage(img,x+s*.12,y+s*.12,s*.76,s*.76);cx.restore()}
function bg(){const g=cx.createLinearGradient(0,0,0,cv.h);g.addColorStop(0,feverLeft>0?'#6d5410':'#193e29');g.addColorStop(1,feverLeft>0?'#c47a18':'#5f7b3d');cx.fillStyle=g;cx.fillRect(0,0,cv.w,cv.h)}function center(t,y,size,color='#fff'){cx.textAlign='center';cx.fillStyle=color;cx.font=`900 ${size}px -apple-system`;cx.fillText(t,cv.w/2,y);cx.textAlign='left'}
function drawPlay(){const g=geo();bg();cx.fillStyle='#ffd94f';cx.font=`900 ${g.p?24:17}px -apple-system`;cx.fillText('ウホッ！モンキーコンボ',12,g.p?34:22);cx.fillStyle='#fff';cx.font=`800 ${g.p?16:12}px -apple-system`;cx.fillText('SCORE '+score.toLocaleString(),12,g.p?62:43);cx.fillText('TIME '+Math.ceil(timeLeft),cv.w-92,g.p?62:43);cx.fillText('BEST '+best.toLocaleString(),12,g.p?86:62);cx.fillStyle='#422816';cx.fillRect(12,g.p?105:70,cv.w-24,12);cx.fillStyle=feverLeft>0?'#fff06a':'#ffb62e';cx.fillRect(12,g.p?105:70,(cv.w-24)*(feverLeft>0?feverLeft/FEVER_TIME:fever/100),12);cx.fillStyle='#fff';cx.font='700 11px -apple-system';cx.fillText(feverLeft>0?'FEVER ×2  '+feverLeft.toFixed(1)+'s':'FEVER',12,g.p?132:94);if(drag){cx.fillStyle='#ffef65';cx.fillText('MOVE '+moveLeft.toFixed(1)+'s',cv.w-92,g.p?132:94)}for(let r=0;r<5;r++)for(let c=0;c<6;c++){const x=g.side+c*(g.cell+g.gap),y=g.top+r*(g.cell+g.gap);cx.fillStyle='rgba(0,0,0,.25)';cx.fillRect(x,y,g.cell,g.cell);if(board[r][c]!=null)orb(x+2,y+2,g.cell-4,board[r][c],drag&&drag.r===r&&drag.c===c?.65:1)}if(combo||message){center(message||combo+' COMBO!',g.top-10,g.p?25:18,'#ffe43d');if(combo)center(combo+' COMBO!',g.top+22,g.p?20:15,'#fff')}}
function draw(){const now=performance.now(),dt=Math.min((now-last)/1000,.05);last=now;tick(dt);if(state==='play')drawPlay();else{bg();orb(cv.w/2-70,Math.max(90,cv.h*.18),140,2);center('ウホッ！モンキーコンボ',55,27,'#ffd94f');if(state==='title'){center('60秒スコアアタック',cv.h*.52,22);center('タップしてスタート',cv.h*.62,25,'#ffe36b');center('ドラッグは1手5秒・連鎖でFEVER！',cv.h*.70,14)}else{center('TIME UP!',cv.h*.50,34,'#ffe36b');center('SCORE '+score.toLocaleString(),cv.h*.58,27);center('BEST '+best.toLocaleString(),cv.h*.64,18,'#ffd94f');center('タップしてもう一度',cv.h*.74,22)}}requestAnimationFrame(draw)}draw();
</script></body></html>
